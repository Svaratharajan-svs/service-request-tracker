
services:
  db:
    image: postgres:17-alpine
    container_name: service-tracker-db

    restart: unless-stopped

    environment:
      POSTGRES_DB: service_tracker
      POSTGRES_USER: tracker_user
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5432:5432"

    volumes:
      - service_tracker_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U tracker_user -d service_tracker
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  service_tracker_data:
